[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-report"
version = "0.1.0"
description = "Portable local transport-cost reporting application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139,<0.140",
    "jinja2>=3.1,<4",
    "matplotlib>=3.11,<4",
    "openpyxl>=3.1,<4",
    "pillow>=12.2,<13",
    "python-pptx>=1.0,<2",
    "uvicorn>=0.50,<1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.20,<7"]
test = [
    "httpx>=0.28,<0.29",
    "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
