[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-report"
version = "0.1.0"
description = "Portable local transport-cost reporting application"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2",
    "matplotlib",
    "openpyxl",
    "pillow",
    "python-pptx",
    "uvicorn",
]

[project.optional-dependencies]
build = ["pyinstaller"]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
